name: Publicar reels
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Solo revisar (no publica)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publicar lo que ya toca
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
        run: node publicar.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.prueba) && '--prueba' || '' }}
      - name: Guardar el estado de la cola
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add cola.json
          git diff --cached --quiet || (git commit -m "Cola: reels publicados" && git push)
